name: Build Flet APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    # 1. Get code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Setup Python
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # 3. Setup Flutter (required for Flet)
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: "3.19.0"
        
    - name: Install dependencies (binary only)
      run: |
        python -m pip install --upgrade pip setuptools wheel packaging
        pip install --no-cache-dir --only-binary=:all: -r requirements.txt
        
    # 6. Build APK
    - name: Build APK
      run: flet build apk

    # 7. Upload APK artifact
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: flet-apk
        path: build/apk/*.apk
