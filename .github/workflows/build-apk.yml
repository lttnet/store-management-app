name: Build Store Management APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      
      - name: Install dependencies
        run: |
          pip install flet==0.21.2
          pip install requests
          pip install reportlab
      
      - name: Build APK
        id: build
        run: |
          flet build apk --verbose
          
          # Search for APK
          echo "=== Searching for APK ==="
          find . -name "*.apk" -type f
          
          # Get APK path
          APK_FILE=$(find . -name "*.apk" -type f | head -1)
          if [ -n "$APK_FILE" ]; then
            echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
            echo "✅ APK found: $APK_FILE"
          else
            echo "⚠️ No APK found"
          fi
      
      - name: Upload APK
        if: steps.build.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: Store-Management-APK
          path: ${{ steps.build.outputs.apk_path }}
      
      - name: Upload entire build folder (debug)
        if: steps.build.outputs.apk_path == ''
        uses: actions/upload-artifact@v4
        with:
          name: build-folder-debug
          path: build/
