name: Build Store Management APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      
      - name: Create Firebase Key File
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$FIREBASE_KEY" | base64 -d > serviceAccountKey.json
          echo "✅ serviceAccountKey.json created"
      
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.21.2
          pip install firebase-admin
          pip install requests
      
      - name: Verify firebase-admin
        run: |
          python -c "import firebase_admin; print('firebase-admin version:', firebase_admin.__version__)"
      
      - name: Build APK
        run: |
          flet build apk --verbose
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Store-Management-APK
          path: build/apk/release/*.apk
