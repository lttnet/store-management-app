name: Build Store Management APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install flet==0.21.2
        pip install pillow
        pip install numpy
        pip install requests
        pip install pyzbar
        # OpenCV removed - add back later if needed
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.6'
    
    - name: Build APK
      run: flet build apk
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StoreManagement-App
        path: build/apk/*.apk
