name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet
        pip install pillow
        pip install requests
    
    - name: Build APK with Flet
      run: |
        flet pack main.py --name "Store Management" --product-name "StoreManagement" --description "Store Management System" --company-name "YourCompany"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: store-management-apk
        path: ./dist/*.apk
