name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet
        pip install pillow
        pip install reportlab
    
    - name: Create necessary directories
      run: |
        mkdir -p images
        mkdir -p backups
        mkdir -p exports
    
    - name: Create a test database to verify structure
      run: |
        python -c "
        import sqlite3
        conn = sqlite3.connect('store_management.db')
        cursor = conn.cursor()
        cursor.execute('''CREATE TABLE IF NOT EXISTS materials (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            name TEXT NOT NULL,
            category TEXT DEFAULT 'Uncategorized',
            quantity INTEGER DEFAULT 0,
            quality TEXT DEFAULT 'New',
            location_ids TEXT,
            size TEXT,
            length REAL,
            colors TEXT,
            notes TEXT,
            barcode_value TEXT UNIQUE,
            image_path TEXT,
            created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
            updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
        )''')
        conn.commit()
        conn.close()
        print('Database created with category column')
        "
    
    - name: Build APK with Flet
      run: |
        flet pack main.py \
          --name "Store Management" \
          --product-name "StoreManagement" \
          --description "Store Management System" \
          --file-description "Store Management" \
          --copyright "Your Company" \
          --add-data "images:images" \
          --add-data "store_management.db:." \
          --add-data "database.py:." \
          --add-data "managers:managers" \
          --icon "images/logo.png" \
          --verbose
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StoreManagement-App
        path: ./build/Store Management/*.apk
