name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Flet
        run: |
          pip install flet==0.28.3
          pip install -r requirements.txt

      - name: Build APK
        run: |
          flet build apk --module-name src.main --build-version 1.0.0 --build-number 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StoreManagement-APK
          path: build/apk/*.apk
          if-no-files-found: error
