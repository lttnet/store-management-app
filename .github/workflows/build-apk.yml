name: Build Store Management APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
    
    - name: Setup Flutter (Required version for Flet)
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.6'
        channel: 'stable'
    
    - name: Install Flet
      run: |
        python -m pip install --upgrade pip
        pip install flet==0.21.2
    
    - name: Create directories
      run: |
        mkdir -p images
        mkdir -p backups
    
    - name: Fix serious_python compatibility
      run: |
        # Create pubspec.yaml override if needed
        echo "dependency_overrides:" >> pubspec.yaml
        echo "  serious_python: 0.7.0" >> pubspec.yaml
    
    - name: Build APK
      run: |
        export JAVA_HOME=$JAVA_HOME_11_X64
        flet build apk --verbose
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Store-Management-App
        path: build/apk/
