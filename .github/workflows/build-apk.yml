name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Debug - Show main.py
        run: |
          echo "=== main.py content ==="
          head -20 main.py
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install flet==0.21.2
          pip install requests pillow opencv-python pyzbar numpy stripe reportlab
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
      
      - name: Build APK
        run: flet build apk
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StoreApp
          path: build/apk/*.apk
