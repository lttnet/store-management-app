name: Build Store Management APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1
    
    - name: Install Python dependencies (avoid native compilation)
      run: |
        pip install --upgrade pip
        pip install flet==0.21.2
        pip install requests
        pip install pillow
        pip install numpy
        pip install stripe
        pip install reportlab
        # Use headless version of opencv (no GUI dependencies)
        pip install opencv-python-headless
        # For barcode scanning, use a pure Python alternative if pyzbar fails
        pip install python-barcode
        pip install qrcode
    
    - name: Remove problematic packages if needed
      run: |
        # If pyzbar still fails, comment it out
        pip uninstall -y pyzbar || true
    
    - name: Verify installations
      run: |
        python -c "import requests; print('✅ requests')"
        python -c "import flet; print('✅ flet')"
        python -c "import cv2; print('✅ opencv')"
        python -c "import PIL; print('✅ PIL')"
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.2'
    
    - name: Build APK
      run: flet build apk
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StoreManagement-App
        path: build/apk/*.apk
