name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
    
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install Python dependencies (NO NUMPY)
      run: |
        # Install ONLY compatible packages
        pip install flet==0.21.2
        pip install pillow
        pip install plotly
        pip install requests
        
        # Verify no numpy installed
        pip list | grep -i numpy && exit 1 || echo "✅ NumPy not installed"
    
    - name: Build APK
      run: |
        flet build apk \
          --org com.yourcompany.storeapp \
          --name "Store Management" \
          --split-per-abi
    
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: store-management-apk
        path: build/app/outputs/flutter-apk/*.apk
